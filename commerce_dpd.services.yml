services:
  commerce_dpd.order_subscriber:
    class: Drupal\commerce_dpd\EventSubscriber\OrderSubscriber
    arguments: ['@queue']
    tags:
      - { name: event_subscriber }

  commerce_dpd.auth_token_manager:
    class: Drupal\commerce_dpd\Service\DpdAuthTokenManager
    arguments:
      - '@config.factory'
      - '@keyvalue'
      - '@logger.channel.commerce_dpd'
      - '@datetime.time'

  commerce_dpd.api_client:
    class: Drupal\commerce_dpd\ApiClient\DpdApiClient
    arguments:
      - '@logger.channel.commerce_dpd'
      - '@commerce_dpd.auth_token_manager'
      - '@commerce_dpd.cache.parcelshop'

  commerce_dpd.cache.parcelshop:
    class: Symfony\Component\Cache\Adapter\FilesystemAdapter
    arguments:
      - 'commerce_dpd_parcelshop'
      - 0
      - '%app.root%/%site.path%/files/php/cache/commerce_dpd'  

  commerce_dpd.label_service:
    class: Drupal\commerce_dpd\Service\DpdLabelService
    arguments: ['@commerce_dpd.api_client', '@logger.channel.commerce_dpd', '@config.factory']

  commerce_dpd.label_manager:
    class: Drupal\commerce_dpd\Service\DpdLabelManager
    arguments: ['@commerce_dpd.label_service', '@logger.channel.commerce_dpd']
  
  logger.channel.commerce_dpd:
    class: Drupal\Core\Logger\LoggerChannel
    factory: logger.factory:get
    arguments: ['commerce_dpd']
